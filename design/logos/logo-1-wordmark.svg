<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <!-- Logo 1: Clean wordmark with red accent bar -->
  <rect width="320" height="80" fill="white"/>

  <!-- Left red accent bar -->
  <rect x="24" y="20" width="5" height="40" rx="2.5" fill="#D62828"/>

  <!-- LAJME wordmark -->
  <text x="42" y="52"
    font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="36"
    font-weight="800"
    letter-spacing="-1"
    fill="#111111">LAJME</text>

  <!-- Subtle tagline -->
  <text x="43" y="66"
    font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="9"
    font-weight="400"
    letter-spacing="3"
    fill="#888888">LAJME SHQIP</text>
</svg>
