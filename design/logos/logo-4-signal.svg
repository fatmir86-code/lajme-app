<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <!-- Logo 4: Signal/broadcast arcs — news transmission motif -->
  <rect width="320" height="80" fill="white"/>

  <!-- Signal arcs (three concentric quarter-circles, bottom-left origin) -->
  <g fill="none" stroke-linecap="round">
    <path d="M 20 60 Q 20 44 36 44" stroke="#D62828" stroke-width="4.5"/>
    <path d="M 20 60 Q 20 32 52 32" stroke="#D62828" stroke-width="4.5" opacity="0.65"/>
    <path d="M 20 60 Q 20 20 68 20" stroke="#D62828" stroke-width="4.5" opacity="0.3"/>
  </g>
  <!-- Origin dot -->
  <circle cx="20" cy="60" r="4.5" fill="#D62828"/>

  <!-- LAJME wordmark -->
  <text x="84" y="50"
    font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="30"
    font-weight="800"
    letter-spacing="-0.5"
    fill="#111111">LAJME</text>

  <!-- Tagline -->
  <text x="85" y="63"
    font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="8.5"
    font-weight="500"
    letter-spacing="2.5"
    fill="#999999">LAJME NGA SHQIPËRIA</text>
</svg>
