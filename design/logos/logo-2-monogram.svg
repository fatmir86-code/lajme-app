<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <!-- Logo 2: L monogram + wordmark -->
  <rect width="320" height="80" fill="white"/>

  <!-- L monogram box -->
  <rect x="20" y="16" width="48" height="48" rx="10" fill="#D62828"/>

  <!-- L letterform inside box -->
  <text x="31" y="54"
    font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="34"
    font-weight="900"
    fill="white">L</text>

  <!-- Wordmark -->
  <text x="82" y="47"
    font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="28"
    font-weight="700"
    letter-spacing="-0.5"
    fill="#111111">ajme</text>

  <!-- Three news lines (signal/broadcast motif) -->
  <line x1="82" y1="54" x2="176" y2="54" stroke="#DDDDDD" stroke-width="1.5" stroke-linecap="round"/>
</svg>
