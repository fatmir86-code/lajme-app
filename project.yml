name: Lajme
options:
  bundleIdPrefix: com.fatmir.lajme
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.1.7"
    CURRENT_PROJECT_VERSION: 38
    DEVELOPMENT_TEAM: "68HNV4TJ9B"

targets:
  Lajme:
    type: application
    platform: iOS
    entitlements:
      path: Lajme/Lajme.entitlements
      properties:
        com.apple.developer.associated-domains:
          - applinks:fatmir86-code.github.io
    sources:
      - path: Lajme
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_CFBundleDisplayName: "Lajme"
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.news"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        PRODUCT_BUNDLE_IDENTIFIER: com.fatmir.lajme
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: "NO"
        SWIFT_EMIT_LOC_STRINGS: YES
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
